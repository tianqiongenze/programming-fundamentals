# 设备台账参数（改配置不改代码）
# 工单 W01 验收对应：style_min = 本项目承诺档位的规范率门槛（stylecheck 实测）
warn: 80.0
danger: 95.0
unit: "c"
seed: 7
topk: 3
style_min: 90.0
interactive: false     # true 则追加 A 档 input() 录入段落（run.py --set interactive=true）

# ── 工单 W01《验收标准》四档门槛（数字唯一出处，run.py 实测判定用）──
# rate_min: null 表示工单该档未写规范率门槛——不编造数字，只判功能项。
# A 档"达B"→ 规范率沿用 B 的 90。
tiers:
  D:
    rate_min: 70.0
    min_vars: 6
    min_types: 3
  C:
    rate_min:
  B:
    rate_min: 90.0
    min_vars: 8
    min_types: 4
    min_conversions: 2
  A:
    rate_min: 90.0
  # A 档实测路径喂给真 input() 的 stdin 样本（越界 999 / 非数字 abc 必须先被拒收）
  input_feed: "DEV-PROBE\n探针泵\n999\nabc\n75\n450\n380\n2024\ny\n"


